<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Order tracking</title>
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 0; width: 340px; color: #1d2430; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #e3e7ee; }
    h1 { font-size: 14px; margin: 0; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow: auto; }
    li { padding: 8px 12px; border-bottom: 1px solid #f0f2f6; display: grid; gap: 2px; }
    .num { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
    .carrier { color: #5b6577; font-size: 12px; }
    a { color: #1f6feb; }
    .empty { padding: 16px 12px; color: #5b6577; }
    footer { display: flex; gap: 8px; padding: 10px 12px; }
    button { font: inherit; padding: 5px 10px; border: 1px solid #c9d1dd; background: #fff; border-radius: 4px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #1f6feb; outline-offset: 1px; }
    #status { margin-left: auto; color: #5b6577; align-self: center; }
  </style>
</head>
<body>
  <header><h1>Tracking numbers on this page</h1></header>
  <ul id="list"></ul>
  <p id="empty" class="empty" hidden>No tracking numbers found. Open an eBay or Amazon order page, then press Rescan.</p>
  <footer>
    <button id="rescan" type="button">Rescan</button>
    <button id="copy" type="button">Copy CSV</button>
    <span id="status" role="status"></span>
  </footer>
  <script src="carriers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
